<!DOCTYPE html>
<html lang="{{ seo_lang or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seo_title }}</title>
    <meta name="description" content="{{ seo_desc }}">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#2481cc">
    <link rel="icon" type="image/svg+xml" href="/assets/site-icon.svg?v=20260805-football-emoji-canonical-v2">
    <link rel="stylesheet" href="/assets/style.css?v=20260805-admin-monitor-v2">
    <style>
        html, body { min-height: 100%; }
        body { margin: 0; color: #111; background-color: #fff; color-scheme: light; }
        .missing-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            position: relative;
            z-index: 1;
        }
        .missing-panel {
            width: min(100%, 520px);
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, .12);
            border-radius: 8px;
            background: rgba(255, 255, 255, .96);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }
        .missing-icon { width: 72px; height: 72px; }
        h1 { margin: .8rem 0 .5rem; font-size: 1.45rem; letter-spacing: 0; }
        p { margin: 0 0 1.1rem; color: #555; line-height: 1.55; }
        .missing-actions { display: flex; gap: .65rem; justify-content: center; flex-wrap: wrap; }
        .missing-actions a {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .65rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            color: #fff;
            background: #2481cc;
        }
        .missing-actions a.secondary { color: #111; background: #fff; border: 1px solid rgba(0, 0, 0, .16); }
    </style>
</head>
<body>
    <main class="missing-page">
        <section class="missing-panel">
            <img class="missing-icon" src="/assets/site-icon.svg?v=20260805-football-emoji-canonical-v2" alt="">
            <h1>Product unavailable</h1>
            <p>This listing is no longer available. Continue with the closest active catalog selection.</p>
            <nav class="missing-actions" aria-label="Catalog navigation">
                <a href="{{ fallback_url }}">Browse {{ fallback_label }}</a>
                {% if fallback_url != home_url %}<a class="secondary" href="{{ home_url }}">Home</a>{% endif %}
            </nav>
        </section>
    </main>
</body>
</html>
